<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="تصویر نمونه موتورسیکلت اسپرت">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d24"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#e01e2b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e01e2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d48"/>
      <stop offset="1" stop-color="#a3121c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5c69"/>
      <stop offset="1" stop-color="#2a2a33"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 60H800M0 180H800M0 300H800M0 420H800M0 540H800"/>
    <path d="M80 0V600M240 0V600M400 0V600M560 0V600M720 0V600"/>
  </g>
  <ellipse cx="400" cy="380" rx="330" ry="220" fill="url(#glow)"/>

  <!-- سایه‌ی زیر موتور -->
  <ellipse cx="400" cy="472" rx="270" ry="26" fill="#000" opacity=".55"/>

  <g>
    <!-- چرخ عقب -->
    <circle cx="228" cy="392" r="92" fill="#101014" stroke="#3a3a45" stroke-width="10"/>
    <circle cx="228" cy="392" r="52" fill="none" stroke="url(#metal)" stroke-width="9"/>
    <g stroke="#4a4a57" stroke-width="6" stroke-linecap="round">
      <path d="M228 348v-2M228 436v2M184 392h-2M272 392h2M197 361l-1.5-1.5M259 423l1.5 1.5M259 361l1.5-1.5M197 423l-1.5 1.5"/>
    </g>
    <!-- چرخ جلو -->
    <circle cx="596" cy="398" r="86" fill="#101014" stroke="#3a3a45" stroke-width="10"/>
    <circle cx="596" cy="398" r="48" fill="none" stroke="url(#metal)" stroke-width="9"/>
    <g stroke="#4a4a57" stroke-width="6" stroke-linecap="round">
      <path d="M596 356v-2M596 440v2M554 398h-2M638 398h2M567 369l-1.5-1.5M625 427l1.5 1.5M625 369l1.5-1.5M567 427l-1.5 1.5"/>
    </g>

    <!-- طبق و اگزوز -->
    <path d="M232 392h118" stroke="url(#metal)" stroke-width="20" stroke-linecap="round"/>
    <path d="M300 430h74l30 18" stroke="#43434f" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M256 358h60l-6 26h-60Z" fill="#3a3a45"/>

    <!-- موتور -->
    <path d="M352 322h96c14 0 24 10 24 24v52c0 14-10 24-24 24h-84c-16 0-28-12-28-28v-48c0-14 8-24 16-24Z" fill="#33333d"/>
    <g stroke="#585866" stroke-width="5" stroke-linecap="round">
      <path d="M362 340h84M362 358h84M362 376h84"/>
    </g>

    <!-- شاسی و باک -->
    <path d="M300 300c46-16 96-22 150-18l52 4-6 46c-24 12-56 18-92 18h-64l-14-28Z" fill="url(#body)"/>
    <path d="M300 300c46-16 96-22 150-18l52 4-4 16c-58-12-124-10-182 6l-16-8Z" fill="#fff" opacity=".14"/>

    <!-- زین و دم -->
    <path d="M240 292h96l-10 32h-96l10-32Z" fill="#17171c"/>
    <path d="M212 272h72l-14 26h-70Z" fill="url(#body)"/>
    <path d="M204 268h44l-6 12h-44Z" fill="#f4f4f5" opacity=".18"/>

    <!-- فرمان و فِرینگ -->
    <path d="M498 292l38-46 44 12-14 60c-18 10-38 12-58 8l-10-34Z" fill="url(#body)"/>
    <path d="M536 246l44 12-4 16-44-14Z" fill="#fff" opacity=".2"/>
    <path d="M540 236c26-6 44 4 52 22" stroke="#8d8d9c" stroke-width="7" stroke-linecap="round" fill="none" opacity=".8"/>
    <!-- چراغ جلو -->
    <path d="M574 268l32 10-6 34-32-10Z" fill="#ffd9a8" opacity=".92"/>
    <!-- کمک‌فنر جلو -->
    <path d="M560 288l40 106" stroke="url(#metal)" stroke-width="15" stroke-linecap="round"/>
    <path d="M542 276l38 102" stroke="url(#metal)" stroke-width="11" stroke-linecap="round" opacity=".7"/>
    <!-- دسته -->
    <path d="M520 252l-40 8" stroke="#6d6d7c" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
