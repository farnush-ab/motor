<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="تصویر نمونه اسکوتر">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d24"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="sglow" cx="50%" cy="60%" r="55%">
      <stop offset="0" stop-color="#e01e2b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#e01e2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a58"/>
      <stop offset="1" stop-color="#20202a"/>
    </linearGradient>
    <linearGradient id="smetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5c69"/>
      <stop offset="1" stop-color="#2a2a33"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sbg)"/>
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 60H800M0 180H800M0 300H800M0 420H800M0 540H800"/>
    <path d="M80 0V600M240 0V600M400 0V600M560 0V600M720 0V600"/>
  </g>
  <ellipse cx="400" cy="380" rx="330" ry="220" fill="url(#sglow)"/>
  <ellipse cx="400" cy="470" rx="250" ry="24" fill="#000" opacity=".55"/>

  <g>
    <!-- چرخ عقب -->
    <circle cx="250" cy="404" r="76" fill="#101014" stroke="#3a3a45" stroke-width="10"/>
    <circle cx="250" cy="404" r="40" fill="none" stroke="url(#smetal)" stroke-width="8"/>
    <!-- چرخ جلو -->
    <circle cx="574" cy="404" r="76" fill="#101014" stroke="#3a3a45" stroke-width="10"/>
    <circle cx="574" cy="404" r="40" fill="none" stroke="url(#smetal)" stroke-width="8"/>

    <!-- کف پا و بدنه -->
    <path d="M296 380h150l24-40h56l18 46-22 48c-30 14-70 20-118 20h-96c-24 0-40-16-40-38 0-20 12-36 28-36Z" fill="url(#sbody)"/>
    <path d="M300 386h146l20-34h48l6 16h-52l-22 38H300Z" fill="#fff" opacity=".07"/>

    <!-- زین -->
    <path d="M282 328h122c10 0 16 6 16 14s-6 14-16 14H282c-12 0-20-6-20-14s8-14 20-14Z" fill="#15151a"/>
    <path d="M282 330h122c8 0 14 4 14 8H268c0-4 6-8 14-8Z" fill="#fff" opacity=".08"/>

    <!-- سپر و پنل جلو -->
    <path d="M496 316l52-72 46 16-10 74-40 44-38-24Z" fill="url(#sbody)"/>
    <path d="M548 244l46 16-4 24-46-18Z" fill="#fff" opacity=".12"/>
    <path d="M566 292l34 12-6 32-34-12Z" fill="#ffd9a8" opacity=".9"/>

    <!-- فرمان -->
    <path d="M556 240c22-8 42-2 54 16" stroke="#8d8d9c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M540 236l-42 12" stroke="#6d6d7c" stroke-width="10" stroke-linecap="round"/>

    <!-- کمک‌فنر جلو -->
    <path d="M566 300l16 96" stroke="url(#smetal)" stroke-width="14" stroke-linecap="round"/>
    <!-- کمک‌فنر عقب -->
    <path d="M300 356l-16 44" stroke="url(#smetal)" stroke-width="12" stroke-linecap="round"/>
    <!-- اگزوز -->
    <path d="M320 430h96" stroke="#43434f" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
