<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="نقشه محدوده خدمات‌رسانی موتوسنج">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131318"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e01e2b" stop-opacity=".28"/>
      <stop offset="0.65" stop-color="#e01e2b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e01e2b" stop-opacity="0"/>
    </radialGradient>
    <g id="pin">
      <path d="M0-26c-8 0-14 6-14 14 0 10 14 26 14 26S14-2 14-12c0-8-6-14-14-14Z" fill="#e01e2b"/>
      <circle cx="0" cy="-12" r="5.5" fill="#0b0b0d"/>
    </g>
  </defs>

  <rect width="800" height="520" fill="url(#mBg)"/>

  <!-- بلوک‌های شهری -->
  <g fill="#ffffff" fill-opacity=".025">
    <rect x="40" y="40" width="150" height="90" rx="8"/>
    <rect x="220" y="30" width="120" height="120" rx="8"/>
    <rect x="380" y="50" width="180" height="80" rx="8"/>
    <rect x="600" y="40" width="160" height="110" rx="8"/>
    <rect x="50" y="180" width="130" height="130" rx="8"/>
    <rect x="220" y="190" width="160" height="100" rx="8"/>
    <rect x="420" y="180" width="140" height="140" rx="8"/>
    <rect x="600" y="200" width="150" height="110" rx="8"/>
    <rect x="60" y="360" width="170" height="110" rx="8"/>
    <rect x="270" y="340" width="130" height="130" rx="8"/>
    <rect x="440" y="370" width="160" height="100" rx="8"/>
    <rect x="640" y="350" width="120" height="120" rx="8"/>
  </g>

  <!-- خیابان‌ها -->
  <g stroke="#3a3a46" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M0 160H800M0 330H800M200 0V520M400 0V520M580 0V520"/>
  </g>
  <g stroke="#2a2a34" stroke-width="2" opacity=".8">
    <path d="M0 80H800M0 250H800M0 420H800M100 0V520M300 0V520M490 0V520M690 0V520"/>
  </g>

  <!-- بزرگراه اصلی -->
  <path d="M-20 460C160 430 240 300 400 270s300-120 420-190" stroke="#e01e2b" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M-20 60C140 120 260 150 400 200s280 200 420 230" stroke="#4c4c5a" stroke-width="4" fill="none" opacity=".6" stroke-linecap="round"/>

  <!-- محدوده پوشش -->
  <circle cx="400" cy="260" r="250" fill="url(#mGlow)"/>
  <circle cx="400" cy="260" r="250" fill="none" stroke="#e01e2b" stroke-opacity=".35" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="400" cy="260" r="160" fill="none" stroke="#e01e2b" stroke-opacity=".2" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- پین‌ها -->
  <g>
    <use href="#pin" x="400" y="262"/>
    <use href="#pin" x="250" y="180"/>
    <use href="#pin" x="330" y="330"/>
    <use href="#pin" x="480" y="150"/>
    <use href="#pin" x="530" y="330"/>
    <use href="#pin" x="180" y="300"/>
    <use href="#pin" x="620" y="230"/>
    <use href="#pin" x="290" y="90"/>
    <use href="#pin" x="430" y="420"/>
    <use href="#pin" x="660" y="410"/>
    <use href="#pin" x="130" y="120"/>
    <use href="#pin" x="700" y="110"/>
  </g>
</svg>
