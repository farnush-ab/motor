<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="کارشناسی موتورسیکلت پیش از خرید">
  <defs>
    <linearGradient id="hWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="hLamp" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hRed" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#e01e2b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#e01e2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d48"/>
      <stop offset="1" stop-color="#9c1019"/>
    </linearGradient>
    <linearGradient id="hMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83839a"/>
      <stop offset="1" stop-color="#3d3d4a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="760" fill="url(#hWall)"/>

  <!-- بافت دیوار کارگاه -->
  <g stroke="#ffffff" stroke-opacity=".04" stroke-width="2">
    <path d="M0 120H900M0 250H900M0 380H900"/>
    <path d="M150 0V380M300 0V380M450 0V380M600 0V380M750 0V380"/>
  </g>

  <!-- نور سقفی -->
  <path d="M330 0h240l180 420H150Z" fill="url(#hLamp)"/>
  <rect x="360" y="24" width="180" height="12" rx="6" fill="#2c2c36"/>

  <!-- کف -->
  <rect y="470" width="900" height="290" fill="#0d0d11"/>
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <path d="M0 520H900M0 580H900M0 650H900M0 730H900"/>
  </g>
  <ellipse cx="450" cy="600" rx="380" ry="140" fill="url(#hRed)"/>

  <!-- سایه -->
  <ellipse cx="450" cy="620" rx="300" ry="28" fill="#000" opacity=".6"/>

  <!-- موتورسیکلت -->
  <g transform="translate(60,150) scale(0.92)">
    <circle cx="228" cy="392" r="92" fill="#0e0e12" stroke="#55556a" stroke-width="10"/>
    <circle cx="228" cy="392" r="52" fill="none" stroke="url(#hMetal)" stroke-width="9"/>
    <circle cx="596" cy="398" r="86" fill="#0e0e12" stroke="#55556a" stroke-width="10"/>
    <circle cx="596" cy="398" r="48" fill="none" stroke="url(#hMetal)" stroke-width="9"/>

    <path d="M232 392h118" stroke="url(#hMetal)" stroke-width="20" stroke-linecap="round"/>
    <path d="M300 430h74l30 18" stroke="#5b5b6b" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M352 322h96c14 0 24 10 24 24v52c0 14-10 24-24 24h-84c-16 0-28-12-28-28v-48c0-14 8-24 16-24Z" fill="#43434f"/>
    <g stroke="#7c7c8e" stroke-width="5" stroke-linecap="round">
      <path d="M362 340h84M362 358h84M362 376h84"/>
    </g>
    <path d="M300 300c46-16 96-22 150-18l52 4-6 46c-24 12-56 18-92 18h-64l-14-28Z" fill="url(#hBody)"/>
    <path d="M300 300c46-16 96-22 150-18l52 4-4 16c-58-12-124-10-182 6l-16-8Z" fill="#fff" opacity=".14"/>
    <path d="M240 292h96l-10 32h-96l10-32Z" fill="#141419"/>
    <path d="M212 272h72l-14 26h-70Z" fill="url(#hBody)"/>
    <path d="M498 292l38-46 44 12-14 60c-18 10-38 12-58 8l-10-34Z" fill="url(#hBody)"/>
    <path d="M574 268l32 10-6 34-32-10Z" fill="#ffd9a8" opacity=".92"/>
    <path d="M560 288l40 106" stroke="url(#hMetal)" stroke-width="15" stroke-linecap="round"/>
    <path d="M542 276l38 102" stroke="url(#hMetal)" stroke-width="11" stroke-linecap="round" opacity=".7"/>
    <path d="M520 252l-40 8" stroke="#8f8fa2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- نقاط بازرسی (مختصات با موقعیت واقعی قطعات موتور هم‌راستا شده است) -->
  <g fill="none" stroke="#ff3d48" stroke-width="2.5">
    <circle cx="428" cy="486" r="16"/>
    <circle cx="428" cy="486" r="27" opacity=".35"/>
    <circle cx="553" cy="400" r="16"/>
    <circle cx="553" cy="400" r="27" opacity=".35"/>
    <circle cx="270" cy="510" r="16"/>
    <circle cx="270" cy="510" r="27" opacity=".35"/>
  </g>
  <g fill="#ff3d48">
    <circle cx="428" cy="486" r="5"/>
    <circle cx="553" cy="400" r="5"/>
    <circle cx="270" cy="510" r="5"/>
  </g>
  <g stroke="#ff3d48" stroke-width="1.6" stroke-dasharray="5 6" opacity=".7">
    <path d="M428 502v54M569 400h145M254 510h-70"/>
  </g>
  <g fill="#0f0f13" stroke="#2f2f39">
    <rect x="352" y="556" width="152" height="36" rx="10"/>
    <rect x="714" y="382" width="130" height="36" rx="10"/>
    <rect x="44" y="492" width="140" height="36" rx="10"/>
  </g>
  <g fill="#f2f2f4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" text-anchor="middle">
    <text x="428" y="580">موتور و گیربکس</text>
    <text x="779" y="406">بدنه و رنگ</text>
    <text x="114" y="516">لاستیک و ترمز</text>
  </g>
</svg>
